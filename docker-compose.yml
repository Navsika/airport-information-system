services:
  postgres:
    image: postgres:15-alpine
    container_name: airport-postgres
    environment:
      POSTGRES_DB: airport_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d airport_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: