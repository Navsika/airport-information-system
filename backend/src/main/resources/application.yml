server:
  port: 8080

spring:
  web:
    cors:
      mappings:
        "/**":
          allowed-origins: "http://localhost:5173"
          allowed-methods: "*"
          allowed-headers: "*"
  datasource:
    url: jdbc:postgresql://localhost:5432/airport_db
    username: admin
    password: admin

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true